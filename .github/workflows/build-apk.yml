name: Compilar y Generar APK Android

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK con Capacitor y Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Descomprimir archivo ZIP (si se subió en formato .zip)
        run: |
          echo "=== Verificando si existe archivo ZIP ==="
          ZIP_FOUND=$(find . -maxdepth 2 -name "*.zip" ! -path "*/node_modules/*" | head -n 1)
          if [ -n "$ZIP_FOUND" ]; then
            echo "Archivo ZIP detectado: $ZIP_FOUND"
            mkdir -p __unpacked_temp
            unzip -q -o "$ZIP_FOUND" -d __unpacked_temp
            shopt -s dotglob
            if [ -f "__unpacked_temp/package.json" ]; then
              cp -rf __unpacked_temp/* .
            else
              SUBFOLDER=$(find __unpacked_temp -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUBFOLDER" ] && [ -f "$SUBFOLDER/package.json" ]; then
                echo "Moviendo archivos desde subcarpeta: $SUBFOLDER"
                cp -rf "$SUBFOLDER"/* .
              else
                cp -rf __unpacked_temp/* .
              fi
            fi
            shopt -u dotglob
            rm -rf __unpacked_temp
            echo "Archivos extraídos correctamente."
          else
            echo "Usando el código fuente directamente."
          fi
          ls -la

      - name: 3. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Configurar Java JDK 21 (Requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. Configurar Android SDK y Licencias
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: 6. Instalar dependencias del proyecto
        run: |
          npm install --legacy-peer-deps

      - name: 7. Compilar aplicación Web (Vite)
        run: |
          npm run build

      - name: 8. Sincronizar proyecto Android con Capacitor
        run: |
          if [ ! -d "android" ]; then
            echo "Inicializando proyecto Android..."
            npx cap add android
          fi
          echo "Sincronizando archivos y plugins..."
          npx cap sync android

      - name: 9. Compilar APK con Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Subir archivo APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: BibliaDeEscritura-Instalador-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
